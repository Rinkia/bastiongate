name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      # bastionsupply + pyyaml resolve from PyPI; agentbastion tests importorskip.
      - run: python -m pip install -e .
      - run: pytest -q
