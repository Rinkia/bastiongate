name: Publish to PyPI

# Publishes on a GitHub Release. Uses PyPI Trusted Publishing (OIDC) - no API
# token stored. One-time setup on PyPI: create the `bastiongateway` project's
# trusted publisher pointing at this repo + workflow (publish.yml) + environment
# `pypi`. https://docs.pypi.org/trusted-publishers/
# (PyPI dist name is `bastiongateway`; import package / CLI stay `bastiongate`.)
# NOTE: publish the `bastionsupply` dependency to PyPI first, or `pip install
# bastiongate` cannot resolve it.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
