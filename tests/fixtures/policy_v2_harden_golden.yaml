# agentbastion / bastiongate tool policy generated by bastionsupply
# server: contract-server  risk=critical
policy_version: 2
default: deny
allow:
  - list_files
  - sendEmail
deny:
  - run_task
rate_limits:  # agentbastion: cap sensitive tools per session
  sendEmail: 10
gate:  # bastiongate >= 0.8 (older gates ignore this block)
  tools:  # scrub secrets in sensitive tool results
    sendEmail:
      scrub_results: true
